


<div *ngFor="let movieOne of movieItems; let i = index" [appHoverHighlight]="'green'" >
<app-movie-list-item [movieItems]="movieOne"></app-movie-list-item>
  <button (click)="editMovie(movieOne)" [appHoverHighlight]="'plum'"> Edit </button>
  <button (click)="deleteMovie(movieOne.yearReleased)"> Delete </button>

</div>
